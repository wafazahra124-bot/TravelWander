<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="Description" content="My Travel Website">
        <link rel="stylesheet" href="styles.css">
        <title>For Contacts</title>
    </head>
    <body id="new">
        <header>
            <nav id="navbar">
                <a id="logo"><img src="images/travelwanderlogo.jpg" style="height:30px;width:30px; padding-left: 10px;"> TravelWander</a>
                <a href="index.html">home</a>
                <a href="packages.html">packages</a>
                <a href="destination.html">destinations</a>
                <a href="contact.html">contact us</a>
                <input placeholder="search here">
                <button>search</button>
            </nav>
        </header>
        
        <main>
            <section>
                <h2>Welcome to TravelWander</h2>
            </section>
            
            <div class="container">
                <div class="contact-card">
                    <form action="thankyou.html" method="get">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                        
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                        
                        <label for="number">Phone Number:</label>
                        <input type="tel" id="number" name="number" required>
                        
                        <label>Payment Method:</label>
                        <div>
                            <input type="radio" id="card" name="payment_method" value="card">
                            <label for="card">Card</label>
                            
                            <input type="radio" id="cash" name="payment_method" value="cash">
                            <label for="cash">Cash</label>
                        </div>
                        
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" required></textarea>
                        
                        <button type="submit">Submit</button>
                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
